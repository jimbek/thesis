# Οι υπηρεσίες που έχουμε υλοποιήσει είναι:
# 1. api: Η υπηρεσία αυτή τρέχει το Flask API.
# 2. ollama: Η υπηρεσία αυτή τρέχει το Ollama.
# 3. streamlit: Η υπηρεσία αυτή τρέχει το διαχειριστικό περιβάλλον με τη χρήση της βιβλιοθήκης streamlit για το UI.

# Εκτέλεση:
# 1. Ανοίγουμε το Docker Desktop και το τερματικό.
# 2. Πλοηγούμαστε στον φάκελο που περιέχει το αρχείο compose.yaml.
# 3. Εκτελούμε την εντολή 'docker compose up -d'
services:
  api:
    build:
      context: ./
      dockerfile: ./images/api/Dockerfile
    ports:
      - "5000:5000"

  ollama:
    build:
      context: ./
      dockerfile: ./images/ollama/Dockerfile
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  streamlit:
    build:
      context: ./
      dockerfile: ./images/streamlit/Dockerfile
    ports:
      - "8501:8501"
    command: streamlit run admin.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - api
      - ollama

volumes:
  ollama: {}