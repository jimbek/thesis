# We have implemented four services:
# 1. api: This service runs the API server.
# 2. ollama: This service runs the Ollama server.
# 3. streamlit: This service runs the Streamlit admin interface.

# 1. Open Docker Desktop and the terminal.
# 2. Navigate to the directory containing this compose.yaml file.
# 3. Run the command 'docker compose up'
services:
  api:
    build:
      context: ./
      dockerfile: ./images/api/Dockerfile
    ports:
      - "5000:5000"

  ollama:
    build:
      context: ./
      dockerfile: ./images/ollama/Dockerfile
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  streamlit:
    build:
      context: ./
      dockerfile: ./images/streamlit/Dockerfile
    ports:
      - "8501:8501"
    command: streamlit run admin.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - api
      - ollama

volumes:
  ollama: {}