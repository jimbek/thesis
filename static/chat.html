<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Το κύριο container του Chat */
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Η λίστα με τα μηνύματα */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Στυλ για τα μπαλόνια των μηνυμάτων */
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user {
            background-color: #0084ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.agent {
            background-color: #e4e6eb;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.system {
            background-color: #ffe3e3;
            color: #d93838;
            align-self: center;
            font-size: 13px;
            border-radius: 5px;
        }

        /* Στυλ για τον Loader (Typing Indicator) */
        .typing-loader {
            align-self: flex-start;
            background-color: #e4e6eb;
            padding: 12px 16px;
            border-radius: 15px;
            border-bottom-left-radius: 2px;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-loader span {
            width: 8px;
            height: 8px;
            background-color: #90949c;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .typing-loader span:nth-child(2) { animation-delay: 0.15s; }
        .typing-loader span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Η φόρμα εισαγωγής στο κάτω μέρος */
        .chat-input-area {
            padding: 15px;
            background-color: #ffffff;
            border-top: 1px solid #e4e6eb;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccd0d5;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: #0084ff;
        }

        .chat-input-area button {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #0066cc;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Λίστα Μηνυμάτων -->
        <div class="chat-messages" id="chatMessages"></div>

        <!-- Κάτω Μέρος με Input -->
        <form class="chat-input-area" id="chatForm">
            <input type="text" id="userInput" placeholder="Πληκτρολογήστε ένα μήνυμα..." required autocomplete="off">
            <button type="submit">Αποστολή</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatMessages = document.getElementById('chatMessages');

        const API_URL = 'http://127.0.0.1:5000/processes/chat';

        // --- Ανάγνωση του port από το URL ---
        const urlParams = new URLSearchParams(window.location.search);
        const port = urlParams.get('port'); 

        // Συνάρτηση για αυτόματο scroll προς τα κάτω
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Συνάρτηση για προσθήκη κανονικού μηνύματος
        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.innerHTML = text;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        // Συνάρτηση για εμφάνιση του Loader
        function showLoader() {
            const loaderDiv = document.createElement('div');
            loaderDiv.classList.add('typing-loader');
            loaderDiv.id = 'typingLoader';
            loaderDiv.innerHTML = '<span></span><span></span><span></span>';
            chatMessages.appendChild(loaderDiv);
            scrollToBottom();
        }

        // Συνάρτηση για αφαίρεση του Loader
        function removeLoader() {
            const loader = document.getElementById('typingLoader');
            if (loader) {
                loader.remove();
            }
        }

        // Διαχείριση Υποβολής της Φόρμας
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const messageText = userInput.value.trim();
            if (!messageText) return;

            // 1. Εμφάνιση μηνύματος χρήστη και καθαρισμός input
            appendMessage(messageText, 'user');
            userInput.value = '';

            // 2. Εμφάνιση Loader
            showLoader();

            try {
                // 3. API Call στο localhost:8001 συμπεριλαμβάνοντας το port
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        message: messageText,
                        port: port // Προσθήκη της παραμέτρου στο payload
                    })
                });

                removeLoader();

                if (!response.ok) {
                    throw new Error('Σφάλμα δικτύου ή API');
                }

                const data = await response.json();
                
                // 4. Εμφάνιση απάντησης agent
                const agentReply = data.output || JSON.stringify(data);
                appendMessage(agentReply, 'agent');

            } catch (error) {
                console.error('Error:', error);
                removeLoader();
                appendMessage('Αποτυχία σύνδεσης με το API. Βεβαιωθείτε ότι ο server τρέχει στο ' + API_URL, 'system');
            }
        });
    </script>
</body>
</html>
